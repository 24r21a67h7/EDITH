# Project-wide Gradle settings.
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

# JDK: do NOT hard-code org.gradle.java.home here (it is machine-specific).
# Use JDK 17 via Android Studio (Settings > Build Tools > Gradle > Gradle JDK)
# or the JAVA_HOME environment variable. Personal overrides belong in
# ~/.gradle/gradle.properties, which is not part of this repository.
